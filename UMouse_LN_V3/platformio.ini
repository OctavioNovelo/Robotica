; UMouse S3 — PlatformIO
; El código usa la API LEDC por pin (ledcAttach/ledcWrite(pin,...)) => Arduino-ESP32 core 3.x.
; La plataforma "espressif32" oficial de PlatformIO trae core 2.x, por eso se usa pioarduino (core 3.x).
[platformio]
default_envs = umouse_s3

[env:umouse_s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; YD-ESP32-S3 (WROOM-1, USB-UART CH343 en GPIO43/44 => Serial normal, sin CDC).
; Si tu módulo es N16R8 puedes agregar: board_build.arduino.memory_type = qio_opi (no se usa PSRAM).
build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit BNO08x
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
